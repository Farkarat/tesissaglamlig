<title>Tesis Soru Bankası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&subset=latin,latin-ext&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f6f6;
  --surface: #ffffff;
  --surface-2: #e8eff0;
  --text: #15282b;
  --muted: #53686b;
  --border: #cbd8da;
  --accent: #0f6e68;
  --accent-ink: #ffffff;
  --accent-soft: #d6ecea;
  --ok: #1d7a43;
  --ok-soft: #dcf0e2;
  --bad: #b3362b;
  --bad-soft: #f8e1de;
  --warn: #8a5a00;
  --warn-soft: #f6ead0;
  --focus: #0b57d0;
  --shadow: 0 1px 2px rgba(20, 40, 43, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a1c;
    --surface: #162426;
    --surface-2: #1f3033;
    --text: #e3eeee;
    --muted: #9bb1b3;
    --border: #2c4144;
    --accent: #5bc0b6;
    --accent-ink: #08201e;
    --accent-soft: #1b3a38;
    --ok: #6fd49a;
    --ok-soft: #173424;
    --bad: #f08a80;
    --bad-soft: #3a1f1c;
    --warn: #e6bb62;
    --warn-soft: #382c12;
    --focus: #8ab4ff;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a1c;
  --surface: #162426;
  --surface-2: #1f3033;
  --text: #e3eeee;
  --muted: #9bb1b3;
  --border: #2c4144;
  --accent: #5bc0b6;
  --accent-ink: #08201e;
  --accent-soft: #1b3a38;
  --ok: #6fd49a;
  --ok-soft: #173424;
  --bad: #f08a80;
  --bad-soft: #3a1f1c;
  --warn: #e6bb62;
  --warn-soft: #382c12;
  --focus: #8ab4ff;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  font-variant-numeric: tabular-nums;
  overflow-x: hidden;
}
.sayfa {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.kap { max-width: 820px; margin: 0 auto; }

h1 { font-size: 1.35rem; line-height: 1.25; margin: 0 0 4px; font-weight: 600; }
h2 { font-size: 1.15rem; line-height: 1.3; margin: 0 0 8px; font-weight: 600; }
h3 { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.alt { color: var(--muted); font-size: .92rem; margin: 0; }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

.ust { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
.kutu {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  box-shadow: var(--shadow);
}
.kutu + .kutu { margin-top: 14px; }

label.etiket { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
select, input[type="text"] {
  width: 100%;
  min-height: 44px;
  padding: 8px 12px;
  font: inherit;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
}
select { appearance: auto; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px; padding: 8px 16px;
  font: inherit; font-weight: 500;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  text-align: center;
  transition: background-color .15s, border-color .15s;
}
.btn:hover { background: var(--surface-2); }
.btn.ana { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ana:hover { filter: brightness(1.08); background: var(--accent); }
.btn.tehlike { color: var(--bad); border-color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.kucuk { min-height: 44px; font-size: .92rem; }

.satir { display: flex; flex-wrap: wrap; gap: 10px; }
.satir > * { flex: 1 1 140px; min-width: 0; }
.satir > .btn { flex: 1 1 auto; }

.ozet { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.ozet .sayac { font-size: 1.05rem; font-weight: 600; }
.cubuk { flex: 1 1 140px; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; min-width: 100px; }
.cubuk > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.ozet-alt { width: 100%; display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: .88rem; }

.onay { margin-top: 12px; padding: 12px; border: 1px solid var(--bad); border-radius: 8px; background: var(--bad-soft); }
.onay p { margin: 0 0 10px; }
.onay .satir > * { flex: 1 1 120px; }

/* list */
.liste { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.kart {
  display: flex; align-items: center; gap: 12px; width: 100%;
  min-height: 56px; padding: 10px 14px;
  font: inherit; text-align: left; color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
}
.kart:hover { border-color: var(--accent); }
.kart .gov { flex: 1; min-width: 0; }
.kart .bas { font-weight: 500; overflow-wrap: anywhere; }
.kart .alt { font-size: .84rem; }

.rozet {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .78rem; font-weight: 600; white-space: nowrap;
  padding: 3px 9px; border-radius: 999px;
  background: var(--surface-2); color: var(--muted);
  flex: none;
}
.rozet svg { width: 13px; height: 13px; flex: none; }
.rozet.c { background: var(--ok-soft); color: var(--ok); }
.rozet.w { background: var(--bad-soft); color: var(--bad); }
.rozet.s { background: var(--warn-soft); color: var(--warn); }

.bos { text-align: center; padding: 36px 12px; color: var(--muted); }
.bos strong { display: block; color: var(--text); font-size: 1.05rem; margin-bottom: 4px; }

/* task */
.nav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: center; }
.nav .btn { flex: 1 1 100px; }
.nav .sira { flex: 1 1 100%; order: -1; color: var(--muted); font-size: .88rem; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.etiketchip { font-size: .8rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }

.metin { overflow-wrap: anywhere; }
.metin p { margin: 0 0 .8em; }
.metin ul, .metin ol { margin: 0 0 .8em; padding-left: 1.4em; }
.metin li { margin-bottom: .3em; }
.metin > :last-child { margin-bottom: 0; }
.metin svg { max-width: 100%; height: auto; color: var(--text); }
.tablo-kap { overflow-x: auto; margin: 0 0 1em; border: 1px solid var(--border); border-radius: 8px; -webkit-overflow-scrolling: touch; }
.tablo-kap table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.tablo-kap th, .tablo-kap td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tablo-kap th { background: var(--surface-2); font-weight: 600; }
.tablo-kap tr:last-child td { border-bottom: 0; }
.tablo-kap td:not(:first-child), .tablo-kap th:not(:first-child) { text-align: right; }

.alan { margin-bottom: 12px; }
.alan .giris { display: flex; align-items: center; gap: 8px; }
.alan input { flex: 1 1 auto; min-width: 0; font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
.alan .birim { color: var(--muted); font-size: .92rem; flex: none; }
.alan.dogru input { border-color: var(--ok); background: var(--ok-soft); }
.alan.yanlis input { border-color: var(--bad); background: var(--bad-soft); }
.durum { margin-top: 4px; font-size: .88rem; font-weight: 500; }
.dogru .durum { color: var(--ok); }
.yanlis .durum { color: var(--bad); }
.dogru-deger { font-weight: 600; font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }

.mesaj { padding: 10px 12px; border-radius: 8px; margin: 0 0 12px; font-weight: 500; }
.mesaj.ok { background: var(--ok-soft); color: var(--ok); }
.mesaj.bad { background: var(--bad-soft); color: var(--bad); }
.mesaj.info { background: var(--surface-2); color: var(--text); }

.cozum-alan { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px; }
.cozum-alan section { margin-bottom: 14px; }
.cozum-alan section:last-child { margin-bottom: 0; }
.konu-etiket { display: inline-block; font-weight: 600; color: var(--accent); }
.gizli { display: none !important; }

@media (min-width: 640px) {
  .sayfa { padding-block: 32px 56px; }
  h1 { font-size: 1.6rem; }
  .kutu { padding: 20px; }
  .nav .sira { flex: 0 1 auto; order: 0; margin-left: auto; }
  .nav .btn { flex: 0 0 auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>

<div class="sayfa">
  <div class="kap">
    <div class="ust">
      <div>
        <h1>Tesis Soru Bankası</h1>
        <p class="alt">Soruları çöz, cevabını kontrol et, ilerlemeni takip et.</p>
      </div>
      <div class="kutu" id="dersKutu">
        <label class="etiket" for="dersSec">Ders</label>
        <select id="dersSec"></select>
        <div class="ozet" style="margin-top:14px" id="ozet" aria-live="polite"></div>
        <div style="margin-top:12px">
          <button type="button" class="btn kucuk" id="sifirlaBtn">İlerlemeyi sıfırla</button>
        </div>
        <div class="onay gizli" id="sifirlaOnay" role="alertdialog" aria-labelledby="sifirlaMetin">
          <p id="sifirlaMetin">Bu dersteki tüm ilerleme silinecek. Emin misin?</p>
          <div class="satir">
            <button type="button" class="btn tehlike" id="sifirlaEvet">Evet, sıfırla</button>
            <button type="button" class="btn" id="sifirlaHayir">Vazgeç</button>
          </div>
        </div>
      </div>
    </div>

    <main id="icerik" tabindex="-1"></main>
  </div>
</div>

<script src="gorevler/liste.js"></script>
<script>
(function () {
  "use strict";

  var STORAGE_KEY = "tesisSoruBankasi.ilerleme.v1";
  var SIRA = { w: 1, s: 2, c: 3 };

  var $ = function (id) { return document.getElementById(id); };
  var icerik = $("icerik");
  var dersSec = $("dersSec");

  var dersler = Array.isArray(window.DERSLER) ? window.DERSLER : [];
  window.GOREV_BANKASI = window.GOREV_BANKASI || [];

  var state = {
    ders: null,
    hafta: "",
    konu: "",
    gorunum: "liste",   // liste | gorev
    aktif: null,        // aktif görev id
    yukleniyor: false,
    hata: ""
  };
  var yuklenen = {};     // dersId -> true
  var bellek = {};       // storage yoksa bellekte tut
  var ilerleme = oku();

  /* ---------- storage ---------- */
  function oku() {
    try {
      var s = window.localStorage.getItem(STORAGE_KEY);
      if (s) { var o = JSON.parse(s); if (o && typeof o === "object") return o; }
    } catch (e) {}
    return bellek;
  }
  function yaz() {
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(ilerleme)); } catch (e) {}
  }
  function isaretle(id, durum) {
    var eski = ilerleme[id];
    if (!eski || SIRA[durum] > SIRA[eski]) { ilerleme[id] = durum; yaz(); }
  }

  /* ---------- yardımcılar ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function trSirala(a, b) { return String(a).localeCompare(String(b), "tr"); }
  function dersBul(id) { for (var i = 0; i < dersler.length; i++) if (dersler[i].id === id) return dersler[i]; return null; }
  function dersGorevleri() {
    return window.GOREV_BANKASI.filter(function (g) { return g && g.ders === state.ders; })
      .sort(function (a, b) { return (a.hafta - b.hafta) || trSirala(a.id, b.id); });
  }
  function filtreli() {
    return dersGorevleri().filter(function (g) {
      if (state.hafta !== "" && String(g.hafta) !== state.hafta) return false;
      if (state.konu !== "" && g.konu !== state.konu) return false;
      return true;
    });
  }
  function gorevBul(id) {
    var l = window.GOREV_BANKASI;
    for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i];
    return null;
  }
  function sayiOku(s) {
    var a = sayiAdaylari(s);
    return a.length ? a[0] : NaN;
  }
  // Girilen metnin olası sayı karşılıkları. Türkçe yazımda nokta binlik ayırıcı olabilir
  // ("105.219" = 105219, "105.218,86" = 105218.86), bu yüzden belirsiz durumda iki yorum da denenir.
  function sayiAdaylari(s) {
    var t = String(s == null ? "" : s).replace(/\s+/g, "");
    var out = [];
    function ekle(x) {
      if (/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(x)) {
        var n = Number(x);
        if (!isNaN(n) && out.indexOf(n) < 0) out.push(n);
      }
    }
    if (t === "") return out;
    if (t.indexOf(",") >= 0 && t.indexOf(".") >= 0) {
      if (/^[+-]?\d{1,3}(\.\d{3})+,\d+$/.test(t)) ekle(t.replace(/\./g, "").replace(",", "."));
      return out;
    }
    if (t.indexOf(",") >= 0) {
      if ((t.match(/,/g) || []).length === 1) ekle(t.replace(",", "."));
      return out;
    }
    if ((t.match(/\./g) || []).length <= 1) ekle(t);
    if (/^[+-]?[1-9]\d{0,2}(\.\d{3})+$/.test(t)) ekle(t.replace(/\./g, ""));
    return out;
  }
  function sayiYaz(n) {
    if (typeof n !== "number") return String(n);
    var r = Math.round(n * 1e6) / 1e6;
    return String(r).replace(".", ",");
  }
  var IKON = {
    c: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    w: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    s: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
    n: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>'
  };
  var ETIKET = { c: "Çözüldü", w: "Yanlış denendi", s: "Çözüm görüldü", n: "Çözülmedi" };
  function rozet(id) {
    var d = ilerleme[id] || "n";
    return '<span class="rozet ' + d + '">' + IKON[d] + esc(ETIKET[d]) + "</span>";
  }

  /* ---------- dosya yükleme ---------- */
  function dersYukle(dersId, cb) {
    var d = dersBul(dersId);
    if (!d) return cb();
    if (yuklenen[dersId]) return cb();
    var dosyalar = Array.isArray(d.dosyalar) ? d.dosyalar : [];
    if (!dosyalar.length) { yuklenen[dersId] = true; return cb(); }
    var kalan = dosyalar.length, hatalar = [];
    dosyalar.forEach(function (src) {
      var s = document.createElement("script");
      var bitti = false;
      function son(hata) {
        if (bitti) return; bitti = true;
        if (hata) hatalar.push(src);
        if (--kalan === 0) {
          yuklenen[dersId] = true;
          state.hata = hatalar.length ? "Bazı dosyalar yüklenemedi: " + hatalar.join(", ") : "";
          cb();
        }
      }
      s.src = src;
      s.onload = function () { son(false); };
      s.onerror = function () { son(true); };
      document.head.appendChild(s);
    });
  }

  /* ---------- üst kısım ---------- */
  function dersSecimiKur() {
    dersSec.innerHTML = dersler.map(function (d) {
      return '<option value="' + esc(d.id) + '">' + esc(d.ad) + "</option>";
    }).join("");
    if (!dersler.length) dersSec.innerHTML = '<option value="">Ders bulunamadı</option>';
  }
  function ozetCiz() {
    var gor = dersGorevleri();
    var top = gor.length, c = 0, s = 0, w = 0;
    gor.forEach(function (g) {
      var d = ilerleme[g.id];
      if (d === "c") c++; else if (d === "s") s++; else if (d === "w") w++;
    });
    var yuzde = top ? Math.round(c / top * 100) : 0;
    $("ozet").innerHTML =
      '<span class="sayac">' + c + " / " + top + ' çözüldü</span>' +
      '<div class="cubuk" role="progressbar" aria-valuemin="0" aria-valuemax="' + top + '" aria-valuenow="' + c + '" aria-label="Çözülen soru"><i style="width:' + yuzde + '%"></i></div>' +
      '<div class="ozet-alt"><span>Yanlış denenen: ' + w + "</span><span>Çözümü görülen: " + s + "</span></div>";
    $("sifirlaBtn").disabled = !top;
  }

  /* ---------- liste görünümü ---------- */
  function listeCiz() {
    var gor = dersGorevleri();
    state.gorunum = "liste";
    state.aktif = null;
    if (state.yukleniyor) { icerik.innerHTML = '<div class="kutu bos">Yükleniyor…</div>'; return; }
    var hata = state.hata ? '<p class="mesaj bad">' + esc(state.hata) + "</p>" : "";
    if (!gor.length) {
      icerik.innerHTML = hata + '<div class="kutu bos"><strong>Bu derse henüz soru eklenmedi.</strong>Yeni sorular eklendiğinde burada görünecek.</div>';
      return;
    }
    var haftalar = [], konular = [];
    gor.forEach(function (g) {
      if (haftalar.indexOf(g.hafta) < 0) haftalar.push(g.hafta);
    });
    haftalar.sort(function (a, b) { return a - b; });
    if (state.hafta !== "" && haftalar.map(String).indexOf(state.hafta) < 0) state.hafta = "";
    // Konu listesi: yalnızca seçili haftanın konuları (hafta seçilmemişse hepsi)
    gor.forEach(function (g) {
      if (state.hafta !== "" && String(g.hafta) !== state.hafta) return;
      if (g.konu && konular.indexOf(g.konu) < 0) konular.push(g.konu);
    });
    konular.sort(trSirala);
    if (state.konu !== "" && konular.indexOf(state.konu) < 0) state.konu = "";

    var liste = filtreli();
    var html = hata + '<div class="kutu"><h3>Filtreler</h3><div class="satir">' +
      '<div><label class="etiket" for="fHafta">Hafta</label><select id="fHafta"><option value="">Tüm haftalar</option>' +
      haftalar.map(function (h) { return '<option value="' + h + '"' + (String(h) === state.hafta ? " selected" : "") + ">Hafta " + h + "</option>"; }).join("") +
      "</select></div>" +
      '<div><label class="etiket" for="fKonu">Konu (isteğe bağlı)</label><select id="fKonu"><option value="">Tüm konular</option>' +
      konular.map(function (k) { return '<option value="' + esc(k) + '"' + (k === state.konu ? " selected" : "") + ">" + esc(k) + "</option>"; }).join("") +
      "</select></div></div>" +
      '<div class="satir" style="margin-top:12px"><button type="button" class="btn ana" id="rastgele"' + (liste.length ? "" : " disabled") + ">Rastgele soru</button></div></div>";

    html += '<p class="alt" style="margin-top:14px" aria-live="polite">' + liste.length + " soru listeleniyor</p>";
    if (!liste.length) {
      html += '<div class="kutu bos" style="margin-top:10px"><strong>Bu filtreye uyan soru yok.</strong>Hafta veya konu seçimini değiştir.</div>';
    } else {
      html += '<ul class="liste">' + liste.map(function (g) {
        return '<li><button type="button" class="kart" data-id="' + esc(g.id) + '"><span class="gov"><span class="bas">' + esc(g.baslik) +
          '</span><br><span class="alt">Hafta ' + esc(g.hafta) + "</span></span>" + rozet(g.id) + "</button></li>";
      }).join("") + "</ul>";
    }
    icerik.innerHTML = html;

    var fh = $("fHafta"), fk = $("fKonu");
    if (fh) fh.onchange = function () { state.hafta = fh.value; listeCiz(); };
    if (fk) fk.onchange = function () { state.konu = fk.value; listeCiz(); };
    var r = $("rastgele");
    if (r) r.onclick = rastgele;
    Array.prototype.forEach.call(icerik.querySelectorAll(".kart"), function (b) {
      b.onclick = function () { gorevAc(b.getAttribute("data-id")); };
    });
  }

  function rastgele() {
    var l = filtreli();
    if (!l.length) return;
    var cozulmemis = l.filter(function (g) { return ilerleme[g.id] !== "c"; });
    var havuz = cozulmemis.length ? cozulmemis : l;
    gorevAc(havuz[Math.floor(Math.random() * havuz.length)].id);
  }

  /* ---------- görev görünümü ---------- */
  function tabloSar(kok) {
    Array.prototype.forEach.call(kok.querySelectorAll("table"), function (t) {
      if (t.parentNode && t.parentNode.classList && t.parentNode.classList.contains("tablo-kap")) return;
      var w = document.createElement("div");
      w.className = "tablo-kap";
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    });
  }

  function gorevAc(id) {
    var g = gorevBul(id);
    if (!g) return listeCiz();
    state.gorunum = "gorev";
    state.aktif = id;
    var l = filtreli();
    var idx = -1;
    for (var i = 0; i < l.length; i++) if (l[i].id === id) { idx = i; break; }
    var onceki = idx > 0 ? l[idx - 1] : null;
    var sonraki = idx >= 0 && idx < l.length - 1 ? l[idx + 1] : null;
    var sayiTipi = g.cevapTipi === "sayi" && Array.isArray(g.cevaplar) && g.cevaplar.length > 0;

    var html = '<div class="nav">' +
      '<span class="sira">' + (idx >= 0 ? "Soru " + (idx + 1) + " / " + l.length : "") + "</span>" +
      '<button type="button" class="btn" id="geri">Listeye dön</button>' +
      '<button type="button" class="btn" id="onceki"' + (onceki ? "" : " disabled") + ">Önceki</button>" +
      '<button type="button" class="btn" id="sonraki"' + (sonraki ? "" : " disabled") + ">Sonraki</button></div>" +
      '<article class="kutu">' +
      '<div class="meta"><span class="etiketchip">Hafta ' + esc(g.hafta) + "</span>" + '<span id="durumRozet">' + rozet(g.id) + "</span></div>" +
      "<h2>" + esc(g.baslik) + "</h2>" +
      '<div class="metin" id="soruMetin">' + (g.soru || "") + "</div>";

    if (sayiTipi) {
      html += '<form id="form" class="cozum-alan" autocomplete="off" novalidate>';
      g.cevaplar.forEach(function (c, i) {
        html += '<div class="alan" id="alan' + i + '"><label class="etiket" for="in' + i + '">' + esc(c.etiket || "Cevap") + "</label>" +
          '<div class="giris"><input type="text" inputmode="decimal" id="in' + i + '" autocapitalize="off" spellcheck="false" placeholder="Sayı gir (virgül veya nokta)">' +
          (c.birim ? '<span class="birim">' + esc(c.birim) + "</span>" : "") + "</div>" +
          '<div class="durum" id="durum' + i + '" aria-live="polite"></div></div>';
      });
      html += '<div class="satir"><button type="submit" class="btn ana" id="kontrol">Kontrol et</button>' +
        '<button type="button" class="btn" id="goster">Çözümü göster</button></div></form>';
    } else {
      html += '<div class="cozum-alan"><div class="satir"><button type="button" class="btn ana" id="goster">Çözümü göster</button></div></div>';
    }
    html += '<div id="mesaj" aria-live="polite"></div>' +
      '<div id="bilgi" class="cozum-alan gizli"></div></article>';
    icerik.innerHTML = html;
    tabloSar($("soruMetin"));

    $("geri").onclick = listeCiz;
    if (onceki) $("onceki").onclick = function () { gorevAc(onceki.id); };
    if (sonraki) $("sonraki").onclick = function () { gorevAc(sonraki.id); };

    var gosterildi = { konumantik: false, cozum: false };
    function rozetYenile() { $("durumRozet").innerHTML = rozet(g.id); ozetCiz(); }

    function bilgiCiz(tam) {
      var b = $("bilgi");
      var h = '<section><h3>Konu</h3><span class="konu-etiket">' + esc(g.konu || "-") + "</span>" +
        (g.kaynak ? ' <span class="alt">(' + esc(g.kaynak) + ")</span>" : "") + "</section>" +
        '<section><h3>Çözümün mantığı</h3><div class="metin" id="mantikM">' + (g.mantik || "") + "</div></section>";
      if (tam) h += '<section><h3>Çözüm</h3><div class="metin" id="cozumM">' + (g.cozum || "") + "</div></section>";
      b.innerHTML = h;
      b.classList.remove("gizli");
      tabloSar(b);
    }

    if (sayiTipi) {
      $("form").onsubmit = function (e) {
        e.preventDefault();
        var hepsi = true;
        g.cevaplar.forEach(function (c, i) {
          var alan = $("alan" + i), d = $("durum" + i), inp = $("in" + i);
          var v = sayiOku(inp.value);
          alan.classList.remove("dogru", "yanlis");
          if (isNaN(v)) {
            hepsi = false;
            alan.classList.add("yanlis");
            d.textContent = inp.value.trim() === "" ? "Bir sayı gir." : "Geçerli bir sayı değil.";
            return;
          }
          var tol = typeof c.tolerans === "number" ? c.tolerans : 0;
          var uyan = sayiAdaylari(inp.value).some(function (x) { return Math.abs(x - c.deger) <= tol + 1e-9; });
          if (uyan) {
            alan.classList.add("dogru");
            d.innerHTML = "Doğru. Cevap: <span class=\"dogru-deger\">" + esc(sayiYaz(c.deger)) + "</span>" + (c.birim ? " " + esc(c.birim) : "");
          } else {
            hepsi = false;
            alan.classList.add("yanlis");
            d.textContent = "Yanlış. Tekrar dene.";
          }
        });
        var m = $("mesaj");
        if (hepsi) {
          isaretle(g.id, "c");
          m.innerHTML = '<p class="mesaj ok" style="margin-top:12px">Tüm cevaplar doğru.</p>';
        } else {
          isaretle(g.id, "w");
          m.innerHTML = '<p class="mesaj bad" style="margin-top:12px">Her alan doğru değil. Doğru olanlar işaretlendi; yanlışları düzeltip tekrar dene ya da çözümü göster.</p>';
        }
        bilgiCiz(gosterildi.cozum);
        gosterildi.konumantik = true;
        rozetYenile();
      };
    }

    $("goster").onclick = function () {
      if (sayiTipi) {
        g.cevaplar.forEach(function (c, i) {
          var alan = $("alan" + i), d = $("durum" + i);
          if (!alan.classList.contains("dogru")) {
            alan.classList.remove("yanlis");
            d.innerHTML = "Doğru cevap: <span class=\"dogru-deger\">" + esc(sayiYaz(c.deger)) + "</span>" + (c.birim ? " " + esc(c.birim) : "");
          }
        });
      }
      gosterildi.cozum = true;
      gosterildi.konumantik = true;
      isaretle(g.id, "s");
      bilgiCiz(true);
      rozetYenile();
      $("bilgi").scrollIntoView({ block: "nearest" });
    };

    window.scrollTo(0, 0);
    var h2 = icerik.querySelector("h2");
    if (h2) { h2.setAttribute("tabindex", "-1"); h2.focus({ preventScroll: true }); }
  }

  /* ---------- sıfırlama ---------- */
  function sifirlaKur() {
    $("sifirlaBtn").onclick = function () {
      $("sifirlaOnay").classList.remove("gizli");
      $("sifirlaEvet").focus();
    };
    $("sifirlaHayir").onclick = function () {
      $("sifirlaOnay").classList.add("gizli");
      $("sifirlaBtn").focus();
    };
    $("sifirlaEvet").onclick = function () {
      dersGorevleri().forEach(function (g) { delete ilerleme[g.id]; });
      yaz();
      $("sifirlaOnay").classList.add("gizli");
      ozetCiz();
      if (state.gorunum === "gorev" && state.aktif) gorevAc(state.aktif); else listeCiz();
    };
  }

  /* ---------- başlangıç ---------- */
  function dersDegistir(id) {
    state.ders = id;
    state.hafta = "";
    state.konu = "";
    state.hata = "";
    state.yukleniyor = !yuklenen[id];
    $("sifirlaOnay").classList.add("gizli");
    ozetCiz();
    listeCiz();
    if (state.yukleniyor) {
      dersYukle(id, function () {
        state.yukleniyor = false;
        if (state.ders === id) { ozetCiz(); listeCiz(); }
      });
    }
  }

  dersSecimiKur();
  sifirlaKur();
  dersSec.onchange = function () { dersDegistir(dersSec.value); };
  if (dersler.length) {
    dersSec.value = dersler[0].id;
    dersDegistir(dersler[0].id);
  } else {
    $("ozet").innerHTML = "";
    icerik.innerHTML = '<div class="kutu bos"><strong>Bu derse henüz soru eklenmedi.</strong>Ders listesi (gorevler/liste.js) boş veya yüklenemedi.</div>';
    $("sifirlaBtn").disabled = true;
  }
})();
</script>
